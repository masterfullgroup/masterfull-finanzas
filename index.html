<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#315efb">
  <title>Masterfull Finanzas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260802-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260802-1"></script>
  <script src="app.js?v=20260802-1" defer></script>
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M20 7H4m0 0 4-4M4 7l4 4M4 17h16m0 0-4-4m4 4-4 4"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 7V6a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15v10H5a3 3 0 0 1-3-3V7"/><path d="M16 14h.01"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/></symbol>
      <symbol id="i-budget" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 2v20M12 7h4M12 11h4M12 15h2"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4 11 3.8A2 2 0 0 0 9.6 3H5a2 2 0 0 0-2 2v4.6A2 2 0 0 0 3.8 11l9.6 9.6a2 2 0 0 0 2.8 0l4.4-4.4a2 2 0 0 0 0-2.8Z"/><circle cx="7.5" cy="7.5" r="1"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/><path d="m15.5 8.5 5-5M17 3.5h3.5V7"/></symbol>
      <symbol id="i-debt" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M15.5 8.5H10a2.5 2.5 0 0 0 0 5h4a2.5 2.5 0 0 1 0 5H8.5"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M7 14h4l2 2h4"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 16l4-5 4 3 5-7"/></symbol>
    </defs>
  </svg>
  <div id="toast" class="toast" role="status"></div>
  <section id="auth" class="auth-view hidden">
    <main class="auth-card">
      <div class="brand"><span class="brand-mark">M</span><span><strong>Masterfull</strong><small>Finanzas personales</small></span></div>
      <p class="eyebrow">TU ESPACIO FINANCIERO</p>
      <h1 id="auth-title">Bienvenido de nuevo</h1>
      <p id="auth-copy">Ingresa para continuar organizando tus finanzas.</p>
      <form id="auth-form">
        <label>Correo electrónico<input id="auth-email" type="email" required autocomplete="email"></label>
        <label>Contraseña<input id="auth-password" type="password" required minlength="6" autocomplete="current-password"></label>
        <button class="btn primary full" type="submit">Iniciar sesión</button>
      </form>
      <button id="auth-toggle" class="text-button" type="button">¿No tienes cuenta? Crear cuenta</button>
    </main>
  </section>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <a class="brand sidebar-brand" href="#resumen"><span class="brand-mark">M</span><span><strong>Masterfull</strong><small>Finanzas personales</small></span></a>
      <nav id="navigation"></nav>
      <div class="profile"><span id="avatar" class="avatar">M</span><span><strong id="profile-name">Mi cuenta</strong><small id="profile-mode">Cuenta personal</small></span><button id="logout" title="Cerrar sesión">↪</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p id="page-eyebrow" class="eyebrow">PANEL FINANCIERO</p><h1 id="page-title">Resumen</h1></div>
        <div class="top-actions"><span id="today" class="date-chip"></span><button id="add-main" class="btn primary">＋ Nuevo registro</button></div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <dialog id="record-dialog">
    <form id="record-form" method="dialog">
      <header><div><p class="eyebrow">NUEVO REGISTRO</p><h2 id="dialog-title">Registrar</h2></div><button class="icon-btn" value="cancel" formnovalidate>×</button></header>
      <div id="form-fields" class="form-grid"></div>
      <footer><button class="btn secondary" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" id="save-record" value="default">Guardar</button></footer>
    </form>
  </dialog>
</body>
</html>
